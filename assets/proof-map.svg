<text x="600" y="355" class="muted" text-anchor="middle">0</text>
<text x="732" y="355" class="muted" text-anchor="middle">2</text>
<text x="600" y="400" class="label" text-anchor="middle">y = z + 1/z,   x = z²</text>
<text x="600" y="440" class="label" text-anchor="middle">274y⁴ − 692y² + 184</text>
<text x="600" y="468" class="muted" text-anchor="middle">real roots strictly in (−2, 2)</text>
<text x="600" y="500" class="label" text-anchor="middle">Gauss–Lucas + minor signs</text>
