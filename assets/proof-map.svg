<text x="996" y="440" class="label" text-anchor="middle">n = 4, k = 2</text>
<text x="996" y="468" class="muted" text-anchor="middle">c = (1, 2, 3, 4)</text>
<text x="996" y="500" class="label" text-anchor="middle">8 zeros on |x| = 1</text>
<text x="600" y="568" class="label" text-anchor="middle" font-size="17">Known recurrence  →  path determinant  →  disk polarization  →  reciprocity</text>
<text x="600" y="605" class="muted" text-anchor="middle" font-size="15">Dots are numerical illustrations. The general conclusion comes from the analytic proof.</text>
