<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
<title id="title">A path-matrix route to the unit circle</title>
<desc id="desc">Numerical illustrations of four unit-capacity roots on a circle, four roots of the doubled transform in the interval minus two to two, and eight unequal-capacity roots on a circle. The analytic proof uses a path determinant, real-root localization, and polarization.</desc>
<rect width="1200" height="640" rx="24" fill="#101b2c"/>
<style>text{font-family:Arial,Helvetica,sans-serif}.label{fill:#e9eef7;font-size:18px}.muted{fill:#aebed5;font-size:16px}.title{fill:#f6f8fc;font-weight:700}.axis{stroke:#7890ac;stroke-width:1.4}.panel{fill:#18273d;stroke:#30435d;stroke-width:1.2}</style>
<text x="42" y="52" class="title" font-size="30">A path-matrix route to the unit circle</text>
<text x="42" y="82" class="muted" >Ferroni–McGinnis Conjecture 4.5  ·  positive integer capacities</text>
<rect x="32" y="108" width="344" height="422" rx="16" class="panel"/>
<circle cx="60" cy="139" r="13" fill="#75bfff"/>
<text x="60" y="145" class="title" font-size="16" text-anchor="middle" style="fill:#101b2c">1</text>
<text x="82" y="145" class="title" font-size="14">UNIT CAPACITIES</text>
<rect x="428" y="108" width="344" height="422" rx="16" class="panel"/>
<circle cx="456" cy="139" r="13" fill="#c3a6ff"/>
<text x="456" y="145" class="title" font-size="16" text-anchor="middle" style="fill:#101b2c">2</text>
<text x="478" y="145" class="title" font-size="14">REAL-ROOT LOCALIZATION</text>
<rect x="824" y="108" width="344" height="422" rx="16" class="panel"/>
<circle cx="852" cy="139" r="13" fill="#ffc477"/>
<text x="852" y="145" class="title" font-size="16" text-anchor="middle" style="fill:#101b2c">3</text>
<text x="874" y="145" class="title" font-size="14">ARBITRARY CAPACITIES</text>
<line x1="79" y1="308" x2="329" y2="308" class="axis"/>
<line x1="204" y1="183" x2="204" y2="433" class="axis"/>
<circle cx="204" cy="308" r="100" fill="none" stroke="#75bfff" stroke-width="2" opacity="0.8"/>
<text x="315" y="328" class="muted" font-size="13">Re</text>
<text x="213" y="196" class="muted" font-size="13">Im</text>
<text x="304" y="298" class="muted" font-size="13">1</text>
